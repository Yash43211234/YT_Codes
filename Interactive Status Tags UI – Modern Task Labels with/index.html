<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status Tags</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="tags">
    <div class="tag in-progress"><span>⏳</span> In progress</div>
    <div class="tag to-do"><span>➕</span> To-do</div>
    <div class="tag in-review"><span>📋</span> In Review</div>
    <div class="tag design-review"><span>🎨</span> Design Review</div>
    <div class="tag rework"><span>🔄</span> Rework</div>
    <div class="tag done"><span>✅</span> Done</div>
    <div class="tag not-started"><span>⭕</span> Not Started</div>
    <div class="tag blocked"><span>⛔</span> Blocked</div>
    <div class="tag on-hold"><span>⏸</span> On Hold</div>
    <div class="tag archived"><span>📦</span> Archived</div>
  </div>
</body>
</html>
