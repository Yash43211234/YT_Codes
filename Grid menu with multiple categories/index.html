<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Grid Menu</title>
  <!--
    This line links the HTML document to our separate stylesheet.
    The browser will now apply the styles defined in 'style.css'.
  -->
  <link rel="stylesheet" href="style.css">
  
  <!--
    We're still using the Poppins font, so we'll link it here.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!--
    The grid-menu container with a unique class for styling.
  -->
  <div class="grid-menu">
    <!-- Each menu item is a div with a consistent class for styling. -->
    <div class="menu-item">Web Design</div>
    <div class="menu-item">Start a Blog</div>
    <div class="menu-item">Landing Page</div>
    <div class="menu-item">Start a Business</div>
    <div class="menu-item">Domains</div>
    <div class="menu-item">Freelancing</div>
    <div class="menu-item">Branding</div>
    <div class="menu-item">UX Design</div>
    <div class="menu-item">Logo Design</div>
    <div class="menu-item">SEO</div>
    <div class="menu-item">Hosting</div>
    <div class="menu-item">Social Media</div>
  </div>

</body>
</html>
