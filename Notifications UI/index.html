<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification UI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="notifications-container">
        <div class="notifications-header">
            <h2>🔔 Notifications</h2>
            <button class="mark-as-read">Mark all as read</button>
        </div>

        <div class="notifications-list">
            <div class="notification">
                <img src="https://randomuser.me/api/portraits/women/65.jpg" alt="user profile picture">
                <div class="notification-content">
                    <p><strong>Sophia</strong> liked your post ❤️</p>
                    <span>2 min ago</span>
                </div>
            </div>

            <div class="notification">
                <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="user profile picture">
                <div class="notification-content">
                    <p><strong>James</strong> commented: “Nice work 👏”</p>
                    <span>10 min ago</span>
                </div>
            </div>

            <div class="notification unread">
                <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="user profile picture">
                <div class="notification-content">
                    <p><strong>Emma</strong> followed you ✅</p>
                    <span>1 hr ago</span>
                </div>
                <div class="unread-dot"></div>
            </div>

            <div class="notification unread">
                <img src="https://randomuser.me/api/portraits/men/21.jpg" alt="user profile picture">
                <div class="notification-content">
                    <p><strong>Liam</strong> sent a message 💬</p>
                    <span>4 hr ago</span>
                </div>
                <div class="unread-dot"></div>
            </div>
        </div>
    </div>
</body>
</html>
